name: diff-apply
description: >-
  Diff two texts and apply the result straight back, end to end on the platform's
  own composition surface — the chain the package's round-trip guarantee is about.
  This is the flow that exercises ApplyPatch, so the guarantee is proven where
  consumers actually wire nodes together, not only at invoke level.

# Composing INTO ApplyPatch uses its scalar `unified_diff` input rather than the
# nested `patch` message. A flow edge currently carries only scalar leaves, so
# routing the whole Patch envelope across an edge fails at run time with
# "encoding kind KIND_MESSAGE not implemented" — and, worse, compiles green
# first. The scalar hop is exact: ApplyPatch parses the text with the same
# strict reader ParseUnifiedDiff uses.
#
# ApplyPatch also needs the ORIGINAL text, which a Patch does not carry (a patch
# describes a change, not the thing it changes). It is threaded from the flow's
# own input rather than from make_diff's output.
nodes:
  - alias: make_diff
    package: christiangeorgelucas/diff-tools@0.3.0
    node: Diff
  - alias: apply
    package: christiangeorgelucas/diff-tools@0.3.0
    node: ApplyPatch

edges:
  - from: make_diff
    to: apply
    adapter:
      # Diff emits the diff as text; ApplyPatch consumes it as text.
      "unified_diff": unified_diff
      # The text being patched comes from the flow input, not from the diff.
      "original": original
